<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오라홀릭 게스트하우스 관리</title>
<meta name="description" content="세부 오라홀릭 게스트하우스 A·B·C·D 4채의 예약·캘린더·보증금·공동 운영을 관리하는 앱">
<meta name="theme-color" content="#0E6E6A">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오라홀릭">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 접속 비밀번호 잠금 화면 · 비밀번호를 맞히기 전에는 앱(app-shell)을 그리지 않습니다 -->
<div id="lockScreen" class="lock-screen" role="dialog" aria-modal="true" aria-labelledby="lockTitle" aria-describedby="lockSub">
  <div class="lock-card">
    <div class="lock-mark"><img src="./icon.svg" alt="" width="56" height="56"></div>
    <h1 id="lockTitle">오라홀릭 게스트하우스</h1>
    <p class="lock-sub" id="lockSub">관리자 로그인</p>
    <p class="lock-lead">예약 장부는 <b>비밀번호를 아는 사람만</b> 열 수 있습니다.</p>

    <form id="lockForm" class="lock-form" novalidate autocomplete="off">
      <div class="field" style="margin:0">
        <label for="lockPin">접속 비밀번호</label>
        <input type="password" id="lockPin" class="lock-pin" inputmode="numeric" maxlength="12"
               autocomplete="current-password" spellcheck="false" placeholder="비밀번호">
      </div>
      <label class="lock-keep" for="lockKeep">
        <input type="checkbox" id="lockKeep" checked>
        <span>이 기기에서 로그인 유지</span>
      </label>
      <div id="lockError" class="lock-error" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn primary block lock-submit" id="lockSubmit">🔓 잠금 해제</button>
    </form>

    <p class="lock-hint" id="lockDefaultHint">처음 여는 기기라면 기본 비밀번호 <b>0000</b>으로 들어간 뒤, <b>⚙️ 설정 → 접속 비밀번호</b>에서 꼭 바꿔 주세요.</p>
    <p class="lock-foot">사장님 · 엘레나</p>
  </div>
</div>

<div class="app hidden" id="app-shell" hidden>

  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="./icon.svg" alt="" width="42" height="42">
      <div class="brand-text">
        <h1>오라홀릭<span class="bh-more"> 게스트하우스</span></h1>
        <p>세부 · 4채 운영 관리</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="app-switch" href="./accounting/" title="회계 정산 열기" aria-label="회계 정산 열기"><span class="as-ico" aria-hidden="true">💰</span><span class="as-label">회계</span></a>
      <button type="button" id="syncBadge" class="sync-badge off" title="동기화 설정 열기" aria-label="동기화 상태">
        <i class="dot" aria-hidden="true"></i><span id="syncBadgeText">로컬 저장만 사용 중</span>
      </button>
      <button type="button" id="operatorBtn" class="operator-btn" title="작업자 바꾸기" aria-label="작업자 바꾸기">
        <span class="op-face" aria-hidden="true">👤</span>
        <span id="operatorName">사장님</span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      <button type="button" id="lockBtn" class="lock-btn" title="잠금 · 로그아웃" aria-label="잠금">🔒</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="주요 화면">
    <button type="button" data-view="calendar" class="active">📅 캘린더</button>
    <button type="button" data-view="today">☀️ 오늘 운영</button>
    <button type="button" data-view="bookings">📋 예약</button>
    <button type="button" data-view="finder">💬 손님 안내</button>
    <button type="button" data-view="confirm">🖼 확정서</button>
    <button type="button" data-view="settings">⚙️ 설정</button>
  </nav>

  <main class="main">
    <section id="viewCalendar" class="view"></section>
    <section id="viewToday" class="view hidden"></section>
    <section id="viewBookings" class="view hidden"></section>
    <section id="viewFinder" class="view hidden"></section>
    <section id="viewConfirm" class="view hidden"></section>
    <section id="viewSettings" class="view hidden"></section>
  </main>

  <button type="button" id="fabAdd" class="fab" aria-label="새 예약 추가">＋ <span>예약 추가</span></button>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="./confirmation.js"></script>
<script src="./app.js"></script>
</body>
</html>
